name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run lint
        run: ruff check src/ tests/

      - name: Run type check
        run: mypy src/

      - name: Run tests
        run: pytest tests/ --ignore=tests/integration/ -v
